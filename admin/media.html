<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Postcards from Ben — Photos</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:#0b1420; color:#f5f7fa; }
    main { max-width:820px; margin:auto; padding:24px 18px 64px; }
    h1 { margin:0 0 6px; font-size:28px; }
    p { color:#aeb8c4; line-height:1.45; }
    .card { background:#111d2b; border:1px solid #263648; border-radius:18px; padding:16px; margin:16px 0; }
    label { display:block; margin:12px 0 6px; font-weight:700; }
    select,input,button { width:100%; border-radius:12px; border:1px solid #34475d; background:#0c1724; color:#fff; padding:12px; font-size:16px; }
    button { background:#e9b85d; color:#1c1407; font-weight:800; border:0; cursor:pointer; }
    button.secondary { background:#1b2a3c; color:#e9eef5; }
    button.danger { background:#57242a; color:#fff; }
    button:disabled { opacity:.45; cursor:default; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    .status { min-height:24px; margin-top:10px; white-space:pre-wrap; font-size:13px; color:#c9d3dd; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:12px; }
    .item { background:#0b1622; border:1px solid #263648; border-radius:14px; overflow:hidden; }
    .item img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#07101a; }
    .item-meta { padding:9px; font-size:11px; color:#aeb8c4; word-break:break-all; }
    .item-actions { display:grid; grid-template-columns:1fr 1fr 1.4fr; gap:6px; padding:0 9px 9px; }
    .item-actions button { padding:9px 6px; font-size:13px; }
    .hint { margin:8px 0 0; font-size:12px; color:#91a0af; }
    .hidden { display:none; }
    a { color:#e9b85d; }
    @media(max-width:560px) {
      .grid { grid-template-columns:1fr; }
      .row { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
<main>
  <h1>Photo Manager</h1>
  <p>Choose an adventure, then upload to its hero or gallery. Photos publish automatically to the matching page.</p>

  <section class="card">
    <label for="token">Upload key</label>
    <input id="token" type="password" autocomplete="current-password" placeholder="Enter your media upload key">
    <button id="saveToken" class="secondary" style="margin-top:10px">Use for this browser session</button>
  </section>

  <section class="card">
    <label for="trip">Adventure</label>
    <select id="trip">
      <option value="the-long-way-around">The Long Way Around</option>
      <option value="winter-on-the-black-sea">Winter on the Black Sea</option>
      <option value="autumn-in-hungary">Autumn in Hungary</option>
      <option value="a-special-convention">A Special Convention</option>
      <option value="under-the-mara-sky">Under the Mara Sky</option>
      <option value="an-afternoon-with-giants">An Afternoon with Giants</option>
    </select>

    <div class="row">
      <div>
        <label for="kind">Location</label>
        <select id="kind"></select>
      </div>

      <div id="dayWrap">
        <label for="day">Day</label>
        <select id="day"></select>
      </div>
    </div>

    <label for="files">Photos</label>
    <input id="files" type="file" accept="image/*" multiple>

    <div class="actions">
      <button id="upload">Upload photos</button>
      <button id="refresh" class="secondary">Refresh</button>
    </div>

    <div id="status" class="status"></div>
    <p id="folderHint" class="hint"></p>
  </section>

  <section class="card">
    <strong id="folderLabel">Current folder</strong>
    <p class="hint">Use ↑ and ↓ to control display order. Changes save immediately.</p>
    <div id="grid" class="grid"></div>
  </section>

  <p><a href="/admin/">← Back to editor</a></p>
</main>

<script>
const tripEl = document.getElementById("trip");
const tokenEl = document.getElementById("token");
const kindEl = document.getElementById("kind");
const dayEl = document.getElementById("day");
const dayWrap = document.getElementById("dayWrap");
const filesEl = document.getElementById("files");
const statusEl = document.getElementById("status");
const gridEl = document.getElementById("grid");
const folderLabel = document.getElementById("folderLabel");
const folderHint = document.getElementById("folderHint");
let currentObjects = [];

for (let i = 1; i <= 24; i++) {
  const n = String(i).padStart(2, "0");
  dayEl.insertAdjacentHTML("beforeend", `<option value="${n}">Day ${i}</option>`);
}

tokenEl.value = sessionStorage.getItem("postcards-media-token") || "";

document.getElementById("saveToken").addEventListener("click", () => {
  sessionStorage.setItem("postcards-media-token", tokenEl.value.trim());
  setStatus("Upload key saved for this browser session.");
});

tripEl.addEventListener("change", () => {
  configureLocations();
  refresh();
});

kindEl.addEventListener("change", () => {
  updateDayVisibility();
  refresh();
});

dayEl.addEventListener("change", refresh);
document.getElementById("refresh").addEventListener("click", refresh);
document.getElementById("upload").addEventListener("click", upload);

function isCurrentTrip() {
  return tripEl.value === "the-long-way-around";
}

function configureLocations() {
  kindEl.innerHTML = "";

  if (isCurrentTrip()) {
    kindEl.insertAdjacentHTML("beforeend", '<option value="days">Day photos</option>');
    kindEl.insertAdjacentHTML("beforeend", '<option value="hero">Trip hero</option>');
  } else {
    kindEl.insertAdjacentHTML("beforeend", '<option value="gallery">Gallery</option>');
    kindEl.insertAdjacentHTML("beforeend", '<option value="hero">Hero</option>');
  }

  updateDayVisibility();
}

function updateDayVisibility() {
  dayWrap.classList.toggle("hidden", !(isCurrentTrip() && kindEl.value === "days"));
}

function prefix() {
  const root = `trips/${tripEl.value}`;

  if (isCurrentTrip() && kindEl.value === "days") {
    return `${root}/days/day-${dayEl.value}/`;
  }

  return `${root}/${kindEl.value}/`;
}

function authHeaders(extra = {}) {
  const token = tokenEl.value.trim() || sessionStorage.getItem("postcards-media-token") || "";
  return { ...extra, Authorization: `Bearer ${token}` };
}

function setStatus(message) {
  statusEl.textContent = message;
}

function hint() {
  if (isCurrentTrip() && kindEl.value === "days") {
    return `Anything here appears automatically on Day ${Number(dayEl.value)}.`;
  }

  if (kindEl.value === "hero") {
    return "The first image below is used as this adventure's hero/cover image.";
  }

  return "Everything here appears automatically in this adventure's photo gallery.";
}

async function refresh() {
  const p = prefix();
  folderLabel.textContent = p;
  folderHint.textContent = hint();
  gridEl.innerHTML = "";
  setStatus("Loading…");

  try {
    const res = await fetch(`/api/r2?prefix=${encodeURIComponent(p)}`, { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not list folder.");

    currentObjects = data.objects || [];
    render();
    setStatus(currentObjects.length ? `${currentObjects.length} photo(s)` : "No photos in this folder yet.");
  } catch (err) {
    setStatus(err.message);
  }
}

function render() {
  gridEl.innerHTML = "";

  currentObjects.forEach((obj, index) => {
    const item = document.createElement("article");
    item.className = "item";

    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = obj.url;
    img.alt = "";

    const meta = document.createElement("div");
    meta.className = "item-meta";
    meta.textContent = obj.key.split("/").pop();

    const actions = document.createElement("div");
    actions.className = "item-actions";

    const up = document.createElement("button");
    up.className = "secondary";
    up.textContent = "↑";
    up.title = "Move earlier";
    up.disabled = index === 0;
    up.addEventListener("click", () => move(index, -1));

    const down = document.createElement("button");
    down.className = "secondary";
    down.textContent = "↓";
    down.title = "Move later";
    down.disabled = index === currentObjects.length - 1;
    down.addEventListener("click", () => move(index, 1));

    const del = document.createElement("button");
    del.className = "danger";
    del.textContent = "Delete";
    del.addEventListener("click", () => removePhoto(obj));

    actions.append(up, down, del);
    item.append(img, meta, actions);
    gridEl.appendChild(item);
  });
}

async function move(index, delta) {
  const target = index + delta;
  if (target < 0 || target >= currentObjects.length) return;

  [currentObjects[index], currentObjects[target]] =
    [currentObjects[target], currentObjects[index]];

  render();
  setStatus("Saving order…");

  try {
    const res = await fetch("/api/r2", {
      method: "PUT",
      headers: authHeaders({ "content-type": "application/json" }),
      body: JSON.stringify({
        prefix: prefix(),
        keys: currentObjects.map(obj => obj.key)
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not save order.");
    setStatus("Order saved.");
  } catch (err) {
    setStatus(err.message);
    await refresh();
  }
}

async function removePhoto(obj) {
  if (!confirm("Delete this photo from R2? This cannot be undone.")) return;

  setStatus("Deleting…");

  try {
    const res = await fetch(`/api/r2?key=${encodeURIComponent(obj.key)}`, {
      method: "DELETE",
      headers: authHeaders()
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not delete photo.");

    await refresh();
    setStatus("Photo deleted.");
  } catch (err) {
    setStatus(err.message);
  }
}

async function upload() {
  const files = [...filesEl.files];
  if (!files.length) return setStatus("Choose one or more photos first.");

  const button = document.getElementById("upload");
  button.disabled = true;

  try {
    let completed = 0;

    for (const file of files) {
      setStatus(`Uploading ${completed + 1} of ${files.length}: ${file.name}`);

      const form = new FormData();
      form.append("prefix", prefix());
      form.append("file", file);

      const res = await fetch("/api/r2", {
        method: "POST",
        headers: authHeaders(),
        body: form
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Upload failed for ${file.name}`);
      completed++;
    }

    filesEl.value = "";
    await refresh();
    setStatus(`Uploaded ${completed} photo(s).`);
  } catch (err) {
    setStatus(err.message);
  } finally {
    button.disabled = false;
  }
}

configureLocations();
refresh();
</script>
</body>
</html>
