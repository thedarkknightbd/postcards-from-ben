backend:
  name: github
  repo: thedarkknightbd/postcards-from-ben
  branch: main

site_url: https://postcardsfromben.com
display_url: https://postcardsfromben.com

media_folder: "trips/the-long-way-around/images/uploads"
public_folder: "/trips/the-long-way-around/images/uploads"

media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 82
  strip_metadata: true
  width: 2000
  height: null

collections:

  - name: "long_way_around"
    label: "The Long Way Around"
    label_singular: "Day"

    folder: "trips/the-long-way-around/data"

    create: false
    extension: "json"
    format: "json"

    identifier_field: "title"

    editor:
      preview: false

    fields:

      - label: "Day Number"
        name: "dayNumber"
        widget: "number"
        value_type: "int"

      - label: "Date"
        name: "date"
        widget: "string"

      - label: "Page Title"
        name: "title"
        widget: "string"

      - label: "Route"
        name: "route"
        widget: "string"

      - label: "Introduction Heading"
        name: "introTitle"
        widget: "string"

      - label: "Today's Story"
        name: "intro"
        widget: "text"


      - label: "Quick Facts"
        name: "facts"
        widget: "list"

        fields:

          - label: "Icon"
            name: "icon"
            widget: "string"

          - label: "Label"
            name: "label"
            widget: "string"

          - label: "Value"
            name: "value"
            widget: "string"


      - label: "Stops"
        name: "stops"
        widget: "list"

        fields:

          - label: "Type"
            name: "type"
            widget: "string"

          - label: "Location"
            name: "name"
            widget: "string"

          - label: "Description"
            name: "description"
            widget: "text"

          - label: "Latitude"
            name: "latitude"
            widget: "number"
            value_type: "float"

          - label: "Longitude"
            name: "longitude"
            widget: "number"
            value_type: "float"


      - label: "Photos"
        name: "photos"
        widget: "list"
        required: false

        fields:

          - label: "Photo"
            name: "file"
            widget: "image"

          - label: "Caption"
            name: "caption"
            widget: "string"
            required: false


      - label: "Postcard from the Road"
        name: "journal"
        widget: "text"
        required: false


      - label: "Videos"
        name: "videos"
        widget: "list"
        required: false

        fields:

          - label: "YouTube Video ID"
            name: "youtubeId"
            widget: "string"

          - label: "Title"
            name: "title"
            widget: "string"


      - label: "Previous Day"
        name: "previousDay"
        widget: "string"
        required: false

      - label: "Next Day"
        name: "nextDay"
        widget: "string"
        required: false