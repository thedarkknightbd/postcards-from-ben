backend:
  name: turbo-github
  turbo_site_id: c7ee06d5-6037-495c-887d-bcbf8f6c9ccc
  branch: main

site_url: https://postcardsfromben.com
display_url: https://postcardsfromben.com

media_folder: "trips/the-long-way-around/images/uploads"
public_folder: "/trips/the-long-way-around/images/uploads"

collections:

  - name: "homepage_settings"
    label: "Homepage"
    editor:
      preview: false
    files:
      - label: "Adventure Status"
        name: "adventure_status"
        file: "data/home-adventure.json"
        fields:
          - label: "Homepage Status"
            name: "status"
            widget: "select"
            options:
              - { label: "Between Adventures", value: "between" }
              - { label: "Currently Traveling", value: "traveling" }
              - { label: "Planning Next Adventure", value: "upcoming" }
            default: "between"
          - label: "Current Adventure"
            name: "currentAdventure"
            widget: "object"
            fields:
              - { label: "Adventure Title", name: "title", widget: "string", required: false }
              - { label: "Homepage Description", name: "description", widget: "text", required: false }
              - { label: "Public Trip Page Path (starts with /)", name: "url", widget: "string", required: false }
          - label: "Upcoming Adventure"
            name: "upcomingAdventure"
            widget: "object"
            fields:
              - { label: "Adventure Title", name: "title", widget: "string", required: false }
              - { label: "Homepage Description", name: "description", widget: "text", required: false }
              - { label: "Public Preview Page Path (starts with /)", name: "url", widget: "string", required: false }


  - name: "future_adventures"
    label: "Where to Next?"
    editor:
      preview: false
    files:
      - label: "Destination Ideas"
        name: "destination_ideas"
        file: "data/where-to-next.json"
        fields:
          - { label: "Introductory Message", name: "intro", widget: "text" }
          - label: "Travel Ideas"
            name: "ideas"
            widget: "list"
            summary: "{{fields.title}} — {{fields.stage}}"
            fields:
              - { label: "Destination", name: "title", widget: "string" }
              - label: "Status"
                name: "stage"
                widget: "select"
                options:
                  - { label: "Dreaming About", value: "dreaming" }
                  - { label: "Taking Shape", value: "planning" }
                  - { label: "Coming Up Next", value: "upcoming" }
                default: "dreaming"
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image Site Path (optional)", name: "image", widget: "string", required: false }
              - { label: "Details Page Path (optional)", name: "url", widget: "string", required: false }

  - name: "long_way_around"
    label: "The Long Way Around"
    label_singular: "Day"

    folder: "trips/the-long-way-around/data"

    create: false
    extension: "json"
    format: "json"

    identifier_field: "title"

    editor:
      preview: false

    fields:

      - label: "Day Number"
        name: "dayNumber"
        widget: "number"
        value_type: "int"

      - label: "Date"
        name: "date"
        widget: "string"

      - label: "Page Title"
        name: "title"
        widget: "string"

      - label: "Route"
        name: "route"
        widget: "string"

      - label: "Introduction Heading"
        name: "introTitle"
        widget: "string"

      - label: "Today's Story"
        name: "intro"
        widget: "text"


      - label: "Kilometers Driven"
        name: "kilometersDriven"
        widget: "number"
        value_type: "int"
        min: 0
        required: false

      - label: "Quick Facts"
        name: "facts"
        widget: "list"

        fields:

          - label: "Icon"
            name: "icon"
            widget: "string"

          - label: "Label"
            name: "label"
            widget: "string"

          - label: "Value"
            name: "value"
            widget: "string"


      - label: "Stops"
        name: "stops"
        widget: "list"

        fields:

          - label: "Type"
            name: "type"
            widget: "string"

          - label: "Location"
            name: "name"
            widget: "string"

          - label: "Description"
            name: "description"
            widget: "text"

          - label: "Latitude"
            name: "latitude"
            widget: "number"
            value_type: "float"

          - label: "Longitude"
            name: "longitude"
            widget: "number"
            value_type: "float"


      - label: "Postcard from the Road"
        name: "journal"
        widget: "text"
        required: false


      - label: "Previous Day"
        name: "previousDay"
        widget: "string"
        required: false

      - label: "Next Day"
        name: "nextDay"
        widget: "string"
        required: false

  - name: "past_postcards"
    label: "Past Postcards"

    editor:
      preview: false

    files:

      - label: "Winter on the Black Sea"
        name: "winter_on_the_black_sea"
        file: "trips/winter-on-the-black-sea/postcard.json"

        fields:
          - label: "Title"
            name: "title"
            widget: "string"

          - label: "Route & Date"
            name: "kicker"
            widget: "string"

          - label: "Subtitle"
            name: "subtitle"
            widget: "string"

          - label: "Section Label"
            name: "sectionLabel"
            widget: "string"

          - label: "Story Heading"
            name: "introTitle"
            widget: "string"

          - label: "Story"
            name: "story"
            widget: "text"

          - label: "Photo Section Heading"
            name: "photoTitle"
            widget: "string"

          - label: "Photo Placeholder"
            name: "photoPlaceholder"
            widget: "string"
            required: false

