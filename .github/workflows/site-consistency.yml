name: Website consistency
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check favicon and navigation consistency
        run: node scripts/check-site-consistency.mjs
      - name: Check private gallery JavaScript syntax
        run: |
          node --check js/beyond-the-postcard.js
          node --check functions/api/private-photos.js
          node --check functions/api/private-photo-order.js
          node --check functions/api/private-photo-manage.js
          node --check functions/api/public-photo-captions.js
          node --check js/public-photo-viewer.js
          node --check js/travel-map.js
          node --check js/past-postcard.js
          node --check js/day-page.js
