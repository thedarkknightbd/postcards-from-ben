name: Rename homepage photographs
on:
  push:
    branches:
      - feature/site-evolution
    paths:
      - .github/workflows/rename-homepage-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-evolution
          persist-credentials: true
      - name: Rename uploaded photos
        shell: bash
        run: |
          set -euo pipefail
          git mv images/IMG_2101.jpeg images/featured-adventure.jpg
          git mv images/IMG_2102.jpeg images/friends-adventure-invite.jpg
          git mv images/IMG_2103.jpeg images/lake-carezza.jpg
          git mv images/IMG_2104.jpeg images/receive-postcard.jpg
          git mv images/IMG_2105.jpeg images/travel-atlas.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rename homepage images to descriptive filenames"
          git push origin HEAD:feature/site-evolution
