<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Postcards from Ben</title><style>body{font:16px system-ui;background:#f7f7f4;color:#202725;margin:0;padding:24px}main{max-width:460px;margin:8vh auto;background:white;border:1px solid #ddd;border-radius:16px;padding:28px}h1{font-size:1.6rem}label{display:block;margin:15px 0 5px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aaa;border-radius:8px;font:inherit}button{margin-top:18px;padding:12px 18px;border:0;border-radius:8px;background:#183f37;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.5}.muted{color:#626c67;font-size:.9rem}.hidden{display:none}a{color:#183f37}</style></head><body><main><a href="/">← Postcards from Ben</a><h1>Welcome back</h1><p class="muted">Sign in with a code sent to your email. Access is granted by invitation or approval.</p><section id="request"><h2>Request access</h2><form id="requestForm"><label for="name">Your name</label><input id="name" autocomplete="name" required maxlength="100"><label for="requestEmail">Email</label><input id="requestEmail" type="email" autocomplete="email" required><button>Request access</button></form></section><section id="login"><h2>Sign in</h2><form id="codeForm"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><button>Send a code</button></form><form id="verifyForm" class="hidden"><label for="code">Six-digit code</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><button>Sign in</button></form></section><p id="message" role="status" aria-live="polite"></p></main><script>
const $=id=>document.getElementById(id);let challengeId="";
async function send(path,body){const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},credentials:"same-origin",body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||"Request failed");return data;}
async function submit(form,fn){const b=form.querySelector("button");b.disabled=true;$("message").textContent="";try{await fn()}catch(e){$("message").textContent=e.message}finally{b.disabled=false}}
$("requestForm").addEventListener("submit",e=>{e.preventDefault();submit(e.currentTarget,async()=>{const d=await send("/api/access/request-access",{name:$("name").value,email:$("requestEmail").value});$("message").textContent=d.message})});
$("codeForm").addEventListener("submit",e=>{e.preventDefault();submit(e.currentTarget,async()=>{const d=await send("/api/access/request-code",{email:$("email").value});challengeId=d.challenge_id||"";$("message").textContent=d.message;if(challengeId)$("verifyForm").classList.remove("hidden")})});
$("verifyForm").addEventListener("submit",e=>{e.preventDefault();submit(e.currentTarget,async()=>{await send("/api/access/verify-code",{email:$("email").value,code:$("code").value,challenge_id:challengeId});$("message").textContent="Signed in successfully.";const account=await fetch("/api/access/me",{credentials:"same-origin",cache:"no-store"}).then(r=>r.json());location.href=account.can_manage_site?"/admin/access":"/staging/"})});
</script></body></html>
